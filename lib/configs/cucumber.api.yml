default:
  paths:
    - features/Regression/API/**/*.feature
  require:
    - lib/helpers/support/world.ts
    - lib/helpers/support/parameter-types.ts
    - lib/helpers/hooks/api.hooks.ts
    - lib/helpers/hooks/postman.hooks.ts
    - lib/steps/common/**/*.ts
    - lib/steps/api/**/*.ts
    - lib/steps/postman/**/*.ts
    - lib/steps/db/cart.db.steps.ts
  requireModule:
    - ts-node/register
    - tsconfig-paths/register
  format:
    - progress-bar
    - allure-cucumberjs/reporter
  formatOptions:
    resultsDir: allure-results/bdd
  tags: "not @skip and not @ui-only and not @db-only"
  publishQuiet: true
