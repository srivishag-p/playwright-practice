default:
  paths:
    - features/Regression/DB/**/*.feature
  require:
    - lib/helpers/support/world.ts
    - lib/helpers/support/parameter-types.ts
    - lib/helpers/hooks/db.hooks.ts
    - lib/steps/common/**/*.ts
    - lib/steps/db/**/*.ts
  requireModule:
    - ts-node/register
    - tsconfig-paths/register
  format:
    - progress-bar
    - allure-cucumberjs/reporter
  formatOptions:
    resultsDir: allure-results/bdd
  tags: "not @skip and not @ui-only and not @api-only"
  publishQuiet: true
